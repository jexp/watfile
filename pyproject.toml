[project]
name = "watfile"
version = "0.3.1"
description = "Classify documents with the TypeSafe Jev decision model and sort them into folders"
authors = [
    { name = "Michael Hunger", email = "github@jexp.de" }
]
license = "MIT"
readme = "README.md"
keywords = ["classification", "files", "llm", "typesafe", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
requires-python = ">=3.12"
dependencies = [
    "liteparse>=2.14.6",
    "tiktoken>=0.14.0",
    "typesafe-sdk>=0.7.0",
]

[project.optional-dependencies]
# local backends — all optional; pick one (or install several, runtime is auto-detected)
# Apple Silicon, MLX/GPU:            'pip install watfile[laya]'
# Apple Silicon, Core ML / ANE:      'pip install watfile[laya-coreml]'
# Any platform, PyTorch CPU/GPU:     'pip install watfile[laya-torch]'
laya = [
    "laya-mlx>=0.1.0",
]
laya-coreml = [
    "laya-coreml>=0.1.0",
]
laya-torch = [
    "laya>=0.3.4",
]

[project.scripts]
watfile = "watfile.cli:_entry"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[project.urls]
Repository = "https://github.com/jexp/watfile"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
