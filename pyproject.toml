[project]
name = "watfile"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Michael Hunger", email = "github@jexp.de" }
]
requires-python = ">=3.12"
dependencies = [
    "liteparse>=2.14.6",
    "typesafe-sdk>=0.7.0",
]

[project.scripts]
watfile = "watfile:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
